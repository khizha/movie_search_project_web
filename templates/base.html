<!DOCTYPE html>
<html lang="ru">

<head>

    <!-- =========================
         НАСТРОЙКИ СТРАНИЦЫ
         ========================= -->

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>
        {% block title %}
            Поиск фильмов
        {% endblock %}
    </title>


    <!-- =========================
         BOOTSTRAP
         ========================= -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >


    <!-- =========================
         СОБСТВЕННЫЕ СТИЛИ
         ========================= -->

    <link
    rel="stylesheet"
    href="{{ url_for('static', filename='css/style.css') }}">


</head>


<body>


    <!-- =========================
         ФОНОВЫЙ ПРОЖЕКТОР
         ========================= -->

    <div class="spotlight">

    {% include 'spotlight.html' %}

    </div>


    <!-- =========================
         ОСНОВНОЕ СОДЕРЖИМОЕ
         ========================= -->

    <main class="page-content container min-vh-100">

        {% block content %}
        {% endblock %}

    </main>


</body>

</html>
